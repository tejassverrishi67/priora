<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PriorA — ICU Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Prior<span class="brand-a">A</span></div>

    <div class="hero" id="hero">
      <div class="hero-num" id="heroNum"><span id="heroFrom">25</span><span
          class="hero-shift"> &rarr; <span class="hero-to" id="heroTo">2</span></span></div>
      <div class="hero-label" id="heroLabel">Alerts This Shift</div>
    </div>

    <div class="controls">
      <span class="clock" id="clock">tick 0</span>
      <div class="nurse-seg" id="nurseSeg" role="group" aria-label="Nurses on shift">
        <span class="nurse-seg-label">Nurses on shift</span>
        <span class="nurse-seg-opts">
          <button class="nurse-opt is-active" type="button" data-n="1">1</button>
          <button class="nurse-opt" type="button" data-n="2">2</button>
          <button class="nurse-opt" type="button" data-n="3">3</button>
        </span>
      </div>
      <label class="engine-pick">
        <span class="engine-pick-label">Engine</span>
        <select class="pill select" id="engineSel">
          <option value="epic">Epic-style thresholds</option>
          <option value="news">NEWS score</option>
          <option value="broken">Vendor ML model</option>
        </select>
      </label>
      <button class="pill pill--priora" id="prioraBtn" type="button">Activate PriorA</button>
      <button class="pill" id="pauseBtn" type="button">Pause</button>
      <button class="pill" id="resetBtn" type="button">Reset</button>
    </div>
  </header>

  <main>
    <section class="wall" id="wall" aria-label="ICU patient wall"></section>
    <div class="assign-caption" id="assignCaption" hidden></div>
    <div class="watchlist" id="watchlist" hidden></div>
    <p class="watchlist-note" id="watchlistNote" hidden>Nothing is removed. Anyone who worsens returns automatically.</p>
    <section class="compare" id="compare" aria-label="What most systems show vs. what PriorA shows" hidden></section>
  </main>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
